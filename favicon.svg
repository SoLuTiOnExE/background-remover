<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Magic Wand Gradient -->
    <linearGradient id="wandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Accent Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <!-- Transparency Checkerboard Pattern -->
    <pattern id="checkerboard" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#FFFFFF"/>
      <rect width="16" height="16" fill="#E2E8F0"/>
      <rect x="16" y="16" width="16" height="16" fill="#E2E8F0"/>
    </pattern>

    <!-- Rounded Clip for Image Object -->
    <clipPath id="subjectClip">
      <path d="M 120 120 L 392 120 C 410 120 424 134 424 152 L 424 360 C 424 378 410 392 392 392 L 120 392 C 102 392 88 378 88 360 L 88 152 C 88 134 102 120 120 120 Z"/>
    </clipPath>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>

  <!-- Canvas Frame Base (Transparent Checkerboard Side) -->
  <rect x="88" y="120" width="336" height="272" rx="24" fill="url(#checkerboard)"/>

  <!-- Left Side: Original Image Solid Fill -->
  <path d="M 120 120 L 256 120 L 256 392 L 120 392 C 102 392 88 378 88 360 L 88 152 C 88 134 102 120 120 120 Z" fill="#3B82F6"/>

  <!-- Cutout Subject (Person / Object silhouette bridging solid and transparent area) -->
  <g clip-path="url(#subjectClip)">
    <!-- Mountain / Subject silhouette -->
    <path d="M 130 392 L 210 270 L 260 330 L 330 220 L 410 392 Z" fill="#1E1B4B" opacity="0.85"/>
    <circle cx="330" cy="190" r="30" fill="#FDE047"/>
  </g>

  <!-- Removal Eraser / Magic Cutting Line (Dashed Cutout Sweep) -->
  <path d="M 256 100 L 256 412" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="12 12" stroke-linecap="round"/>

  <!-- Magic Wand Handle -->
  <rect x="310" y="310" width="120" height="20" rx="10" transform="rotate(-45 310 310)" fill="url(#wandGrad)"/>

  <!-- Magic Wand Tip Glow -->
  <circle cx="230" cy="230" r="14" fill="#FFFFFF"/>

  <!-- Sparkles / Magic Effect Icons -->
  <!-- Main Sparkle 1 -->
  <path d="M 230 180 Q 230 200 210 200 Q 230 200 230 220 Q 230 200 250 200 Q 230 200 230 180 Z" fill="url(#sparkleGrad)"/>
  <!-- Sparkle 2 -->
  <path d="M 170 140 Q 170 155 155 155 Q 170 155 170 170 Q 170 155 185 155 Q 170 155 170 140 Z" fill="#38BDF8"/>
  <!-- Sparkle 3 -->
  <path d="M 340 130 Q 340 145 325 145 Q 340 145 340 160 Q 340 145 355 145 Q 340 145 340 130 Z" fill="url(#sparkleGrad)"/>
  <!-- Small Star Dots -->
  <circle cx="280" cy="170" r="5" fill="#38BDF8"/>
  <circle cx="200" cy="250" r="4" fill="#F43F5E"/>
</svg>
